{{define "content"}}
<h1>Create an agent</h1>
<p class="sub">Define an agent. Named here, it proceeds straight to a charter draft; left unnamed, it is staged for naming as its own step.</p>

{{if not .Endpoints}}
<div class="flash err">You need at least one <a href="/endpoints">endpoint</a> before creating an agent.</div>
{{else}}
<div class="card" style="max-width:620px">
<form method="post" action="/agents/new">
<label>Agent identifier <span class="muted">— unique server-side handle, e.g. iris-octane2</span></label>
<input type="text" name="identifier" required>

<label>Agent name <span class="muted">— what the agent goes by; leave blank to name it in a separate step (with model suggestions) after creation</span></label>
<div class="row">
<input type="text" name="name" placeholder="(blank = staged naming on the agent page)" style="flex:1">
</div>

<label>Endpoint</label>
<select name="endpoint_id">
{{range .Endpoints}}<option value="{{.ID}}">{{.Name}} ({{.Kind}})</option>{{end}}
</select>

<label>Model <span class="muted">— model ID as the endpoint expects it</span></label>
<input type="text" name="model" placeholder="anthropic/claude-3.5-sonnet or a stub value" required>

<label><input type="checkbox" name="model_aware" style="width:auto;display:inline"> Tell the agent which model it is running on</label>

<label>Deployment primer <span class="muted">— host, local context, goals, desired posture</span></label>
<textarea name="primer" required placeholder="You are being deployed to a Silicon Graphics Octane2 running IRIX 6.5..."></textarea>

<div style="margin-top:16px"><button>Create agent</button></div>
</form>
</div>
{{end}}
{{end}}
