{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Refresh}}<meta http-equiv="refresh" content="{{.Refresh}}">{{end}}
<title>{{.Title}} — JANUS</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#2a313c;--ink:#d7dee7;--dim:#8b97a6;--acc:#6ea8fe;--accd:#274268;--ok:#3fb950;--warn:#d29922;--bad:#f85149;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{border-bottom:1px solid var(--line);background:var(--panel);padding:0 20px}
header .wrap{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:20px;height:52px}
header .brand{font-weight:700;letter-spacing:.5px}
header .brand span{color:var(--acc)}
header .brand .phase{color:var(--dim);font-size:12px;font-weight:400;letter-spacing:0;margin-left:2px}
header nav{display:flex;gap:16px;font-size:14px}
header .sp{flex:1}
main{max-width:980px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:28px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sub{color:var(--dim);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:0 0 14px}
.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--dim);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
input[type=text],input[type=password],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;font:inherit}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
button,.btn{display:inline-block;background:var(--accd);color:#fff;border:1px solid #35547f;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
button:hover,.btn:hover{background:#325081;text-decoration:none}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.bad{background:#5c1f1f;border-color:#7d2b2b}
.btn.ok{background:#1c3d24;border-color:#2a5c34}
.btn.sm{padding:4px 9px;font-size:13px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:#1d3524}.pill.off{color:var(--dim)}
.pill.draft{color:var(--warn);border-color:#3a2f16}.pill.approved{color:var(--ok);border-color:#1d3524}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.flash{border:1px solid;border-radius:6px;padding:10px 12px;margin:0 0 16px;font-size:14px}
.flash.err{border-color:#5c2626;background:#2a1615;color:#f0a8a3}
.flash.ok{border-color:#264d30;background:#15251a;color:#96d9a6}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;font-size:13px;white-space:pre-wrap;word-break:break-word}
code.tok{font-family:ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:4px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.msg .who{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin-bottom:4px}
.msg.admin{background:#13233a;border-color:#274268}
.msg.agent{background:var(--panel)}
.msg.tool_call{background:#1a1e14;border-color:#33401e}
.msg.tool_result{background:#0f1a12;border-color:#26402c}
.msg.system{background:transparent;border-style:dashed;color:var(--dim)}
.msg pre{margin:0;background:transparent;border:none;padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="brand">JA<span>N</span>US <span class="phase">{{.Version}}</span></div>
{{if .Authed}}<nav>
<a href="/">Dashboard</a>
<a href="/endpoints">Endpoints</a>
<a href="/agents">Agents</a>
</nav>{{end}}
<div class="sp"></div>
{{if .Authed}}<form method="post" action="/logout" style="margin:0"><button class="btn ghost sm">Log out</button></form>{{end}}
</div></header>
<main>
{{if .Flash}}<div class="flash {{.FlashKind}}">{{.Flash}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
